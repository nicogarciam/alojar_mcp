<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel CasaBlanca Las Grutas — Asistente Virtual</title>
    <meta name="description" content="Consultá disponibilidad, gestioná reservas y precios del Hotel CasaBlanca Las Grutas con nuestra IA.">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- React CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <!-- Babel para JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Marked.js para renderizado de Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- DOMPurify para sanitizar HTML -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.5/purify.min.js"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- Estilos -->
    <link rel="stylesheet" href="styles-extended.css">
</head>

<body>

    <!-- Hero section -->
    <div class="hero">
        <div class="hero-content">
            <div class="hotel-badge">⭐ Hotel Boutique</div>
            <h1>Hotel CasaBlanca</h1>
            <p class="hero-subtitle">Las Grutas · Patagonia Argentina</p>
            <div class="hero-tags">
                <span class="tag"><i class="fas fa-water"></i> Frente al mar</span>
                <span class="tag"><i class="fas fa-wifi"></i> WiFi incluido</span>
                <span class="tag"><i class="fas fa-car"></i> Estacionamiento</span>
            </div>
        </div>
    </div>

    <!-- Chatbot root -->
    <div id="chatbot-root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect, useCallback } = React;

        // ─── Configuración ───────────────────────────────────────────────────
        const API_BASE = (typeof window !== 'undefined' && (window.location.port === '3000' || window.location.pathname.includes('/'))) ? '/api' : 'http://localhost:3000/api';

        const INITIAL_SUGGESTIONS = [
            { icon: "📅", text: "Quiero ver disponibilidad para este fin de semana" },
            { icon: "🏨", text: "¿Qué alojamientos tienen para 4 personas?" },
            { icon: "💰", text: "¿Cuánto cuesta una habitación en diciembre?" },
            { icon: "📋", text: "Quiero hacer una reserva" },
        ];

        // ─── Hooks ───────────────────────────────────────────────────────────
        function useLocalTime(timestamp) {
            return new Date(timestamp).toLocaleTimeString('es-AR', {
                hour: '2-digit', minute: '2-digit'
            });
        }

        // ─── Componentes ─────────────────────────────────────────────────────

        const TypingIndicator = () => (
            <div className="message assistant">
                <div className="msg-avatar assistant-avatar">
                    <span>X</span>
                </div>
                <div className="msg-bubble">
                    <div className="typing-indicator">
                        <span></span><span></span><span></span>
                    </div>
                </div>
            </div>
        );

        const ToolsBadge = ({ tools }) => {
            if (!tools || tools.length === 0) return null;
            const labels = {
                check_availability: '🔍 Disponibilidad',
                create_booking: '✅ Reserva creada',
                list_bookings: '📋 Reservas',
                get_booking: '📄 Detalle reserva',
                update_booking: '✏️ Reserva actualizada',
                cancel_booking: '❌ Reserva cancelada',
                list_accommodation_prices: '💰 Precios',
                price_grid: '📊 Grilla precios',
                create_accommodation_price: '➕ Precio creado',
                update_accommodation_price: '✏️ Precio actualizado',
                delete_accommodation_price: '🗑️ Precio eliminado',
                search_customers: '👤 Cliente buscado',
                create_customer: '👤 Cliente creado',
                show_accommodation_detail: '🏨 Detalle alojamiento',
            };
            return (
                <div className="tools-badge-row">
                    {tools.map((t, i) => (
                        <span key={i} className="tool-badge">
                            {labels[t] || `🔧 ${t}`}
                        </span>
                    ))}
                </div>
            );
        };

        const Message = ({ message }) => {
            const isUser = message.role === 'user';
            const isSystem = message.role === 'system';
            const time = useLocalTime(message.timestamp);

            const renderMarkdown = (content) => {
                const rawMarkup = marked.parse(content || '');
                const sanitized = DOMPurify.sanitize(rawMarkup);
                return { __html: sanitized };
            };

            if (isSystem) {
                return (
                    <div className="message-system-wrapper">
                        <div className="message-system">
                            <div dangerouslySetInnerHTML={renderMarkdown(message.content)} />
                        </div>
                    </div>
                );
            }

            return (
                <div className={`message ${isUser ? 'user' : 'assistant'}`}>
                    {!isUser && (
                        <div className="msg-avatar assistant-avatar">
                            <span>X</span>
                        </div>
                    )}
                    <div className="msg-content-col">
                        <div className="msg-bubble">
                            {isUser ? (
                                <span>{message.content}</span>
                            ) : (
                                <div className="markdown-content" dangerouslySetInnerHTML={renderMarkdown(message.content)} />
                            )}
                        </div>
                        <ToolsBadge tools={message.toolsUsed} />
                        <span className="msg-time">{time}</span>
                    </div>
                    {isUser && (
                        <div className="msg-avatar user-avatar">
                            <i className="fas fa-user"></i>
                        </div>
                    )}
                </div>
            );
        };

        const SuggestionChips = ({ suggestions, onSelect, loading }) => (
            <div className="suggestions-grid">
                {suggestions.map((s, i) => (
                    <button
                        key={i}
                        className="suggestion-chip"
                        onClick={() => onSelect(s.text)}
                        disabled={loading}
                    >
                        <span className="chip-icon">{s.icon}</span>
                        <span>{s.text}</span>
                    </button>
                ))}
            </div>
        );

        // ─── Componente principal ─────────────────────────────────────────────
        const FloatingChatBot = () => {
            const [messages, setMessages] = useState([]);
            const [input, setInput] = useState('');
            const [loading, setLoading] = useState(false);
            const [showSuggestions, setShowSuggestions] = useState(true);
            const [isOpen, setIsOpen] = useState(false);
            const [hasUnread, setHasUnread] = useState(false);
            const [sessionId] = useState(() =>
                `session_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`
            );
            const messagesEndRef = useRef(null);
            const inputRef = useRef(null);

            marked.setOptions({ breaks: true, gfm: true });

            // Scroll al fondo cuando llegan mensajes
            useEffect(() => {
                messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
            }, [messages, loading]);

            // Focus en el input cuando abre
            useEffect(() => {
                if (isOpen) {
                    setTimeout(() => inputRef.current?.focus(), 300);
                }
            }, [isOpen]);

            // Mensaje de bienvenida
            useEffect(() => {
                setMessages([{
                    id: 'welcome',
                    role: 'system',
                    content: '¡Hola! 👋 Soy **Ximena**, tu asistente virtual.\n\nPuedo ayudarte con:\n- 📅 Consultar disponibilidad\n- 📋 Gestionar reservas\n- 💰 Ver y administrar precios\n\n¿En qué puedo ayudarte hoy?',
                    timestamp: new Date()
                }]);
            }, []);

            const sendMessage = useCallback(async (messageText = null) => {
                const text = (messageText || input).trim();
                if (!text || loading) return;

                setShowSuggestions(false);
                setInput('');
                setLoading(true);

                const userMsg = {
                    id: `msg_${Date.now()}`,
                    role: 'user',
                    content: text,
                    timestamp: new Date()
                };
                setMessages(prev => [...prev, userMsg]);

                try {
                    const response = await fetch(`${API_BASE}/chat`, {
                        method: 'POST',
                        headers: { 
                            'Content-Type': 'application/json',
                            'Accept': 'text/event-stream, application/json'
                        },
                        body: JSON.stringify({ message: text, sessionId, stream: true })
                    });

                    if (!response.ok) throw new Error(`Error ${response.status}`);

                    const contentType = response.headers.get('content-type') || '';
                    if (contentType.includes('text/event-stream') && response.body) {
                        const reader = response.body.getReader();
                        const decoder = new TextDecoder();
                        let buffer = '';

                        while (true) {
                            const { done, value } = await reader.read();
                            if (done) break;
                            buffer += decoder.decode(value, { stream: true });

                            const parts = buffer.split('\n\n');
                            buffer = parts.pop() || '';

                            for (const part of parts) {
                                const lines = part.split('\n');
                                for (const line of lines) {
                                    if (line.startsWith('data: ')) {
                                        let event = null;
                                        try {
                                            event = JSON.parse(line.slice(6));
                                        } catch (parseErr) {
                                            console.error('Error parsing SSE JSON:', parseErr, line);
                                            continue;
                                        }

                                        if (!event) continue;

                                        if (event.type === 'intermediate_message') {
                                            setMessages(prev => [
                                                ...prev,
                                                {
                                                    id: `inter_${Date.now()}_${Math.random().toString(36).substr(2, 5)}`,
                                                    role: 'assistant',
                                                    content: event.content,
                                                    timestamp: new Date()
                                                }
                                            ]);
                                            // Garantizar que mientras se ejecuta la tool se mantiene el loading
                                            setLoading(true);
                                            if (!isOpen) setHasUnread(true);
                                        } else if (event.type === 'final') {
                                            setMessages(prev => [
                                                ...prev,
                                                {
                                                    id: event.messageId || `ai_${Date.now()}`,
                                                    role: 'assistant',
                                                    content: event.response,
                                                    timestamp: new Date(event.timestamp || Date.now()),
                                                    toolsUsed: event.toolsUsed || []
                                                }
                                            ]);
                                            if (!isOpen) setHasUnread(true);
                                        } else if (event.type === 'error') {
                                            setMessages(prev => [
                                                ...prev,
                                                {
                                                    id: `err_${Date.now()}`,
                                                    role: 'assistant',
                                                    content: event.message?.startsWith('Lo siento')
                                                        ? event.message
                                                        : `Lo siento, hubo un error procesando tu solicitud. Por favor, intentá nuevamente. (${event.message || 'Error desconocido'})`,
                                                    timestamp: new Date()
                                                }
                                            ]);
                                            if (!isOpen) setHasUnread(true);
                                        }
                                    }
                                }
                            }
                        }
                    } else {
                        const data = await response.json();
                        if (data.intermediateMessages && data.intermediateMessages.length > 0) {
                            data.intermediateMessages.forEach((msg, idx) => {
                                setMessages(prev => [
                                    ...prev,
                                    {
                                        id: `inter_${Date.now()}_${idx}`,
                                        role: 'assistant',
                                        content: msg,
                                        timestamp: new Date()
                                    }
                                ]);
                            });
                        }
                        const assistantMsg = {
                            id: data.messageId || `ai_${Date.now()}`,
                            role: 'assistant',
                            content: data.response,
                            timestamp: new Date(data.timestamp || Date.now()),
                            toolsUsed: data.toolsUsed || []
                        };

                        setMessages(prev => [...prev, assistantMsg]);
                        if (!isOpen) setHasUnread(true);
                    }

                } catch (error) {
                    console.error('Error en chat:', error);
                    setMessages(prev => [...prev, {
                        id: `err_${Date.now()}`,
                        role: 'assistant',
                        content: '⚠️ Hubo un error procesando tu mensaje. Por favor, intentá nuevamente.',
                        timestamp: new Date()
                    }]);
                } finally {
                    setLoading(false);
                    setTimeout(() => inputRef.current?.focus(), 100);
                }
            }, [input, loading, isOpen, sessionId]);

            const handleKeyDown = (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            };

            const toggleChat = () => {
                setIsOpen(prev => {
                    if (!prev) setHasUnread(false);
                    return !prev;
                });
            };

            const handleTextareaInput = (e) => {
                setInput(e.target.value);
                // Auto-resize
                e.target.style.height = 'auto';
                e.target.style.height = Math.min(e.target.scrollHeight, 120) + 'px';
            };

            return (
                <div className="chatbot-container">

                    {/* Ventana del chat */}
                    <div className={`chatbot-window ${isOpen ? 'open' : ''}`}>

                        {/* Header */}
                        <div className="chat-header">
                            <div className="chat-header-avatar">
                                <div className="header-avatar-circle">X</div>
                                <div className="header-status-dot"></div>
                            </div>
                            <div className="chat-header-info">
                                <h3>Ximena</h3>
                                <p>Asistente Virtual · Hotel CasaBlanca</p>
                            </div>
                            <div className="header-actions">
                                <button
                                    className="header-action-btn"
                                    title="Nueva conversación"
                                    onClick={() => {
                                        setMessages([{
                                            id: 'welcome-reset',
                                            role: 'system',
                                            content: '¡Conversación reiniciada! ¿En qué puedo ayudarte?',
                                            timestamp: new Date()
                                        }]);
                                        setShowSuggestions(true);
                                    }}
                                >
                                    <i className="fas fa-rotate-right"></i>
                                </button>
                                <button className="header-action-btn" onClick={toggleChat}>
                                    <i className="fas fa-xmark"></i>
                                </button>
                            </div>
                        </div>

                        {/* Mensajes */}
                        <div className="chat-messages">
                            {messages.map(msg => (
                                <Message key={msg.id} message={msg} />
                            ))}

                            {loading && <TypingIndicator />}

                            <div ref={messagesEndRef} />
                        </div>

                        {/* Sugerencias */}
                        {showSuggestions && messages.length <= 1 && (
                            <div className="suggestions-container">
                                <p className="suggestions-label">Sugerencias rápidas</p>
                                <SuggestionChips
                                    suggestions={INITIAL_SUGGESTIONS}
                                    onSelect={(text) => sendMessage(text)}
                                    loading={loading}
                                />
                            </div>
                        )}

                        {/* Input */}
                        <div className="chat-input-container">
                            <div className="input-wrapper">
                                <textarea
                                    ref={inputRef}
                                    id="chat-input"
                                    placeholder="Escribí tu mensaje..."
                                    value={input}
                                    onInput={handleTextareaInput}
                                    onChange={(e) => setInput(e.target.value)}
                                    onKeyDown={handleKeyDown}
                                    disabled={loading}
                                    rows="1"
                                />
                                <button
                                    id="send-btn"
                                    className={`send-button ${(!input.trim() || loading) ? 'disabled' : ''}`}
                                    onClick={() => sendMessage()}
                                    disabled={!input.trim() || loading}
                                >
                                    {loading
                                        ? <i className="fas fa-circle-notch fa-spin"></i>
                                        : <i className="fas fa-paper-plane"></i>
                                    }
                                </button>
                            </div>
                            <p className="input-hint">Enter para enviar · Shift+Enter para nueva línea</p>
                        </div>
                    </div>

                    {/* Botón flotante */}
                    <button
                        id="chatbot-toggle-btn"
                        className={`chatbot-button ${isOpen ? 'open' : ''}`}
                        onClick={toggleChat}
                        aria-label="Abrir asistente virtual"
                    >
                        {isOpen
                            ? <i className="fas fa-xmark"></i>
                            : <i className="fas fa-comment-dots"></i>
                        }
                        {hasUnread && !isOpen && <span className="unread-dot"></span>}
                    </button>
                </div>
            );
        };

        const container = document.getElementById('chatbot-root');
        ReactDOM.createRoot(container).render(<FloatingChatBot />);
    </script>

</body>
</html>
