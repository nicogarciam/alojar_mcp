services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    env_file:
      - ./server/.env
    environment:
      - ALOJAR_API_BASE_URL=http://host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - mcp-network

  chat:
    build:
      context: ./chat
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - ./chat/.env
    environment:
      # Sobrescribimos MCP_SERVER_URL para que use el nombre del servicio en Docker
      - MCP_SERVER_URL=http://server:3001/mcp
    depends_on:
      - server
    restart: unless-stopped
    networks:
      - mcp-network

networks:
  mcp-network:
    driver: bridge
